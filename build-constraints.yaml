# Package flags are applied to individual packages, and override the values of
# global-flags
# NB: These flags are shipped to users, ie used in snapshots (#7438):
# as such we should prefer to use the upstream defaults as far as possible
package-flags:
    QuickCheck:
        old-random: false
    pathtype:
        old-time: false

    bz2:
        with-bzlib: false   # Exclude bzlib from benchmarks to avoid unnecessary dependencies.

    mersenne-random-pure64:
        small_base: false

    cloud-haskell:
        tcp: true
        simplelocalnet: true
        p2p: true

    curl:
        new-base: true

    hpio:
        test-hlint: false

    hxt:
        network-uri: true
    hxt-http:
        network-uri: true
    hxt-relaxng:
        network-uri: true

    text:
        integer-simple: false

    time-locale-compat:
        old-locale: false

    HsOpenSSL:
        fast-bignum: false

    NineP:
        bytestring-in-base: false

    nix-paths:
        allow-relative-paths: true

    reedsolomon:
        llvm: false

    functor-classes-compat:
        containers: true

    alerta:
        servant-client-core: false

    cabal-install:
        # https://github.com/haskell/cabal/issues/9054
        native-dns: false

    greskell:
        server-test: false

    windns:
        allow-non-windows: true

    bson:
        _old-network: false

    mongoDB:
        _old-network: false

    sdl2:
      recent-ish: false

    formatting:
      no-double-conversion: true

    hackage-security:
      Cabal-syntax: true

    optics-operators:
      build-readme: false

    # optparse-applicative dependencies depend on the version
    bm:
      optparse-applicative_ge_0_18: true
    horizontal-rule:
      optparse-applicative_ge_0_18: true
    literatex:
      optparse-applicative_ge_0_18: true
    phatsort:
      optparse-applicative_ge_0_18: true
    redact:
      optparse-applicative_ge_0_18: true

    # based on https://github.com/commercialhaskell/stackage/issues/7361
    xxhash-ffi:
      pkg-config: false

    # See https://github.com/commercialhaskell/stackage/issues/7387
    zlib:
      pkg-config: false

    # See https://github.com/commercialhaskell/stackage/issues/7474
    password:
      crypton: true
      # See https://github.com/commercialhaskell/stackage/issues/7265
      argon2: true
      bcrypt: true
      pbkdf2: true
      scrypt: true

    # https://github.com/commercialhaskell/stackage/issues/7461
    hashable:
      arch-native: false

    path:
      os-string: true

# end of package-flags

# Special configure options for individual packages

# This used to be used for extra-include-dirs and extra-lib-dirs
# Instead, we set this in the Docker image itself
configure-args: {}
# end of configure-args


# Used for packages that cannot be built on Linux
skipped-builds:
    - hfsevents
    - lzma-clib
    - vty-windows
    - Win32
    - Win32-notify
    - windns

# end of skipped-builds


